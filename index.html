<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Some things about Xue Lingyun</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 5rem);
      font-weight: 300;
      letter-spacing: 0.05em;
      line-height: 1.4;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
    }

    h1 span {
      display: block;
      font-size: clamp(1rem, 3vw, 1.5rem);
      margin-top: 1.5rem;
      opacity: 0.4;
      letter-spacing: 0.2em;
      animation: fadeInSub 2s ease 1s forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInSub {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 0.4;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <h1>
    Some things about<br>Xue Lingyun
    <span>·  More coming soon  ·</span>
  </h1>
</body>
</html>
